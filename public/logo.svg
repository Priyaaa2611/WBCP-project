<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="46" fill="#111827" stroke="#374151" stroke-width="2"/>
  
  <!-- Outer Satellite Orbit Rings -->
  <ellipse cx="50" cy="50" rx="38" ry="18" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="3 3" transform="rotate(-25 50 50)"/>
  
  <!-- Satellite Orbit Dot -->
  <circle cx="20" cy="36" r="3.5" fill="#60a5fa"/>
  <circle cx="20" cy="36" r="6" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>

  <!-- Stylized Bio Leaf -->
  <path d="M50 24 C36 34 34 56 48 74 C50 77 50 77 52 74 C66 56 64 34 50 24 Z" fill="#22c55e" opacity="0.95"/>
  
  <!-- Leaf Central Vein -->
  <path d="M50 28 L50 72" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <!-- Lateral Veins -->
  <path d="M50 40 Q57 44 60 48" stroke="#111827" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M50 52 Q43 56 40 60" stroke="#111827" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Geolocation Pin / Radar Crosshairs -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4"/>
</svg>
